<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Recuperar Contraseña — SUMARJ</title>
 <link rel="icon" href="/static/img/logo.png">
 <link rel="stylesheet" href="/static/css/app.css">
 <link rel="manifest" href="/manifest.json">
 <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
 <meta name="theme-color" content="#0a0a0a">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="SUMARJ">
 <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
 <div class="login-shell">
 <div class="login-card">
 <div class="login-logo">
 <img src="/static/img/logo.png" alt="SUMARJ">
 </div>
 <h1 class="login-title">Recuperar Contraseña</h1>
 <p class="login-subtitle">Te enviaremos un enlace por correo</p>

 <div id="alert" class="alert alert-error hidden"></div>
 <div id="success" class="alert alert-info hidden"></div>

 <form id="forgotForm">
 <div class="form-group">
 <label class="form-label" for="correo">Correo electrónico</label>
 <input class="form-input" id="correo" type="email"
 placeholder="tu@correo.com" required autofocus>
 <div style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">
 Ingresa el correo asociado a tu cuenta.
 </div>
 </div>
 <button type="submit" class="btn btn-primary btn-block" id="btnSend">
 Enviar enlace
 </button>
 </form>

 <div style="text-align: center; margin-top: 24px;">
 <a href="/login" style="font-size: 13px;">← Volver al inicio de sesión</a>
 </div>
 </div>
 </div>

 <script>
 const form = document.getElementById('forgotForm');
 const alertBox = document.getElementById('alert');
 const successBox = document.getElementById('success');
 const btn = document.getElementById('btnSend');

 form.addEventListener('submit', async (e) => {
 e.preventDefault();
 alertBox.classList.add('hidden');
 successBox.classList.add('hidden');
 btn.disabled = true;
 btn.innerHTML = '<span class="spinner"></span> Enviando...';

 try {
 const res = await fetch('/api/auth/forgot-password', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 correo: document.getElementById('correo').value.trim(),
 }),
 });
 const data = await res.json();
 if (!res.ok) throw new Error(data.detail || 'Error');
 successBox.textContent = data.mensaje || 'Si el correo existe, recibirás un enlace en breve.';
 successBox.classList.remove('hidden');
 form.style.display = 'none';
 } catch (err) {
 alertBox.textContent = err.message;
 alertBox.classList.remove('hidden');
 btn.disabled = false;
 btn.textContent = 'Enviar enlace';
 }
 });
 </script>
 <script>
 // Registro del Service Worker (PWA)
 if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
 navigator.serviceWorker.register('/sw.js')
 .then(() => console.log('[SW] Registrado'))
 .catch((e) => console.warn('[SW] Error:', e));
 });
 }
 </script>
</body>
</html>
