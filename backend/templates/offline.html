<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Sin conexión — SUMARJ</title>
 <link rel="icon" href="/static/img/logo.png">
 <link rel="manifest" href="/static/manifest.json">
 <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
 <meta name="theme-color" content="#0a0a0a">
 <style>
 :root { --gold: #d4af37; --bg: #0a0a0a; --text: #f5f5f0; --muted: #888; }
 * { box-sizing: border-box; margin: 0; padding: 0; }
 body {
 background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
 color: var(--text);
 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
 min-height: 100vh; display: grid; place-items: center; padding: 24px;
 }
 .card {
 max-width: 480px; text-align: center;
 background: rgba(255,255,255,0.03);
 border: 1px solid rgba(212,175,55,0.2);
 border-radius: 16px; padding: 48px 32px;
 }
 .icon {
 width: 80px; height: 80px; margin: 0 auto 24px;
 border-radius: 50%; background: rgba(212,175,55,0.1);
 display: grid; place-items: center; font-size: 40px;
 }
 h1 {
 font-family: 'Playfair Display', 'Times New Roman', serif; font-size: 28px;
 color: var(--gold); margin-bottom: 12px; letter-spacing: 2px;
 }
 p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; font-size: 15px; }
 .btn {
 display: inline-block;
 background: linear-gradient(180deg, #e8c547, #d4af37);
 color: #0a0a0a; padding: 14px 28px; border-radius: 8px;
 text-decoration: none; font-weight: 700; letter-spacing: 1px;
 border: none; cursor: pointer; font-size: 14px;
 }
 .status {
 margin-top: 24px; padding: 12px; border-radius: 8px;
 font-size: 13px; background: rgba(217,83,79,0.1);
 color: #ff8888; border-left: 3px solid #d9534f;
 }
 .status.online {
 background: rgba(92,184,92,0.1); color: #88dd88;
 border-left-color: #5cb85c;
 }
 </style>
</head>
<body>
 <div class="card">
 <div class="icon"></div>
 <h1>Sin Conexión</h1>
 <p>
 No se puede conectar al servidor de SUMARJ. Verifica que estés conectado al
 WiFi correcto y que el sistema esté encendido.
 </p>
 <button class="btn" onclick="window.location.reload()">Intentar de nuevo</button>
 <div class="status" id="status"> Sin conexión a internet</div>
 </div>

 <script>
 const status = document.getElementById('status');
 function update() {
 if (navigator.onLine) {
 status.textContent = ' Conexión restablecida — recargando...';
 status.classList.add('online');
 setTimeout(() => window.location.href = '/app', 1200);
 } else {
 status.textContent = ' Sin conexión a internet';
 status.classList.remove('online');
 }
 }
 window.addEventListener('online', update);
 window.addEventListener('offline', update);
 update();
 </script>
</body>
</html>
