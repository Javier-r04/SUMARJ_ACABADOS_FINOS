<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Nueva Contraseña — SUMARJ</title>
 <link rel="icon" href="/static/img/logo.png">
 <link rel="stylesheet" href="/static/css/app.css">
 <link rel="manifest" href="/manifest.json">
 <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
 <meta name="theme-color" content="#0a0a0a">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <meta name="apple-mobile-web-app-title" content="SUMARJ">
 <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
 <div class="login-shell">
 <div class="login-card">
 <div class="login-logo">
 <img src="/static/img/logo.png" alt="SUMARJ">
 </div>
 <h1 class="login-title">Nueva Contraseña</h1>
 <p class="login-subtitle" id="userLabel">Verificando enlace...</p>

 <div id="alert" class="alert alert-error hidden"></div>
 <div id="success" class="alert alert-info hidden"></div>

 <form id="resetForm" style="display: none;">
 <div class="form-group">
 <label class="form-label" for="pwd1">Nueva contraseña</label>
 <input class="form-input" id="pwd1" type="password"
 placeholder="Mínimo 4 caracteres" required autofocus minlength="4">
 </div>
 <div class="form-group">
 <label class="form-label" for="pwd2">Confirmar contraseña</label>
 <input class="form-input" id="pwd2" type="password"
 placeholder="Repite la contraseña" required minlength="4">
 </div>
 <button type="submit" class="btn btn-primary btn-block" id="btnSave">
 Guardar contraseña
 </button>
 </form>

 <div style="text-align: center; margin-top: 24px;">
 <a href="/login" style="font-size: 13px;">← Volver al inicio de sesión</a>
 </div>
 </div>
 </div>

 <script>
 const params = new URLSearchParams(window.location.search);
 const token = params.get('token');

 const form = document.getElementById('resetForm');
 const alertBox = document.getElementById('alert');
 const successBox = document.getElementById('success');
 const userLabel = document.getElementById('userLabel');
 const btn = document.getElementById('btnSave');

 async function validar() {
 if (!token) {
 alertBox.textContent = 'Enlace inválido. Falta el token.';
 alertBox.classList.remove('hidden');
 userLabel.textContent = '';
 return;
 }
 try {
 const res = await fetch('/api/auth/reset-password/validate?token=' + encodeURIComponent(token));
 const data = await res.json();
 if (!res.ok) throw new Error(data.detail || 'Enlace inválido');
 userLabel.textContent = 'Cuenta: ' + data.usuario;
 form.style.display = 'block';
 } catch (err) {
 alertBox.textContent = err.message + '. Solicita uno nuevo.';
 alertBox.classList.remove('hidden');
 userLabel.textContent = '';
 }
 }

 form.addEventListener('submit', async (e) => {
 e.preventDefault();
 alertBox.classList.add('hidden');

 const pwd1 = document.getElementById('pwd1').value;
 const pwd2 = document.getElementById('pwd2').value;

 if (pwd1 !== pwd2) {
 alertBox.textContent = 'Las contraseñas no coinciden.';
 alertBox.classList.remove('hidden');
 return;
 }

 btn.disabled = true;
 btn.innerHTML = '<span class="spinner"></span> Guardando...';

 try {
 const res = await fetch('/api/auth/reset-password/confirm', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ token, nueva_password: pwd1 }),
 });
 const data = await res.json();
 if (!res.ok) throw new Error(data.detail || 'Error');
 form.style.display = 'none';
 successBox.textContent = data.mensaje || 'Contraseña actualizada. Redirigiendo...';
 successBox.classList.remove('hidden');
 setTimeout(() => window.location.href = '/login', 2500);
 } catch (err) {
 alertBox.textContent = err.message;
 alertBox.classList.remove('hidden');
 btn.disabled = false;
 btn.textContent = 'Guardar contraseña';
 }
 });

 validar();
 </script>
 <script>
 // Registro del Service Worker (PWA)
 if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
 navigator.serviceWorker.register('/sw.js')
 .then(() => console.log('[SW] Registrado'))
 .catch((e) => console.warn('[SW] Error:', e));
 });
 }
 </script>
</body>
</html>
